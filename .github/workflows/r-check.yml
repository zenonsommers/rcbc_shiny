name: R Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.4
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libuv1-dev

      - name: Install dependencies
        run: |
          install.packages(c('dplyr', 'tidyr', 'shiny', 'sortable', 'jsonlite', 'purrr', 'tibble', 'vote'))
        shell: Rscript {0}

      - name: Smoke test — source all R files
        run: |
          for (f in list.files('.', pattern = '\\.R$', full.names = TRUE, recursive = FALSE)) {
            cat('Loading:', f, '\n')
            source(f)
          }
          cat('All R files loaded successfully.\n')
        shell: Rscript {0}
