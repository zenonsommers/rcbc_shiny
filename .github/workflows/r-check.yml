name: R Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  RENV_PATHS_ROOT: ~/.cache/R/renv

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libwebp-dev \
            libcurl4-openssl-dev \
            libuv1-dev

      - name: Cache renv library
        uses: actions/cache@v4
        with:
          path: ${{ env.RENV_PATHS_ROOT }}
          key: ${{ runner.os }}-renv-${{ hashFiles('**/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore packages
        run: |
          if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")
          renv::restore()
        shell: Rscript {0}

      - name: Smoke test — source all R files
        run: |
          files <- list.files('.', full.names = TRUE, recursive = FALSE)
          files <- files[endsWith(files, '.R')]
          files <- files[!basename(files) %in% 'startApp.R']
          for (f in files) {
            cat('Loading:', f, '\n')
            source(f)
          }
          cat('All R files loaded successfully.\n')
        shell: Rscript {0}
