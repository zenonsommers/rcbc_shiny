name: R Check
# Cache test — see PR #48

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libwebp-dev \
            libcurl4-openssl-dev \
            libuv1-dev

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2
        with:
          renv-version: latest

      - name: Smoke test — source all R files
        run: |
          files <- list.files('.', full.names = TRUE, recursive = FALSE)
          files <- files[endsWith(files, '.R')]
          files <- files[!basename(files) %in% 'startApp.R']
          for (f in files) {
            cat('Loading:', f, '\n')
            source(f)
          }
          cat('All R files loaded successfully.\n')
        shell: Rscript {0}
