name: R Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.4
    timeout-minutes: 5
    # Caching renv library via actions/cache@v4 — see PR #45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            libwebp-dev \
            libcurl4-openssl-dev \
            libuv1-dev

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2

      - name: Smoke test — source all R files
        run: |
          files <- list.files('.', full.names = TRUE, recursive = FALSE)
          files <- files[endsWith(files, '.R')]
          files <- files[!basename(files) %in% 'startApp.R']
          for (f in files) {
            cat('Loading:', f, '\n')
            source(f)
          }
          cat('All R files loaded successfully.\n')
        shell: Rscript {0}
